<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bengaluru Events Tracker — Live Interactive Dashboard</title>
  <meta name="description" content="Interactive live dashboard for Bengaluru upcoming events, concerts, theatre, and sports, synced directly with Google Sheets." />
  <meta name="theme-color" content="#c84b26" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="page-shell">
    <!-- Top Live Sync Bar -->
    <div class="sync-bar">
      <div class="sync-bar-inner">
        <div class="sync-status-group">
          <span id="syncStatusBadge" class="sync-badge sync-loading">
            <span class="sync-dot"></span>
            <span id="syncStatusText">Syncing live sheet…</span>
          </span>
          <span id="lastSyncedText" class="sync-time"></span>
        </div>
        <div class="sync-actions">
          <button id="refreshBtn" class="btn-ghost btn-sm" type="button" title="Fetch latest data from Google Sheets">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            <span>Refresh</span>
          </button>
          <a id="openSheetLink" class="btn-ghost btn-sm" href="https://docs.google.com/spreadsheets/d/1bD7iUv2YTf8aKaoOxntbqucqKP9RN7t825NWB8aTc0Q/edit?gid=0#gid=0" target="_blank" rel="noopener noreferrer">
            <span>Open Sheet</span>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
      </div>
    </div>

    <!-- Header -->
    <header class="hero-header">
      <div class="hero-text">
        <p class="hero-eyebrow">LIVE BENGALURU DIRECTORY</p>
        <h1 id="dashboardTitle">Bengaluru Upcoming Events</h1>
        <p id="dashboardSubtitle" class="hero-subtitle">Curated guide to live performances, concerts, plays, and sports prioritized by location.</p>
      </div>
      <div class="hero-controls">
        <button id="savedFilterBtn" class="btn-saved" type="button" aria-pressed="false">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span>Shortlist</span>
          <span id="savedCountBadge" class="count-pill">0</span>
        </button>
        <div class="view-switcher" role="group" aria-label="View mode">
          <button id="viewCardsBtn" class="view-btn active" type="button" data-view="cards" title="Card Grid">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span>Cards</span>
          </button>
          <button id="viewTimelineBtn" class="view-btn" type="button" data-view="timeline" title="Chronological Timeline">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Timeline</span>
          </button>
          <button id="viewTableBtn" class="view-btn" type="button" data-view="table" title="Compact Table">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            <span>Table</span>
          </button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <!-- KPI Summary Strip -->
      <section class="kpi-grid" aria-label="Event summary by priority zone">
        <button class="kpi-card active" type="button" data-zone="all" id="kpiAll">
          <div class="kpi-label">Total Events</div>
          <div class="kpi-value" id="kpiAllCount">—</div>
          <div class="kpi-meta" id="kpiAllMeta">All Bengaluru venues</div>
        </button>
        <button class="kpi-card zone-1" type="button" data-zone="Priority 1: East Bangalore" id="kpiZone1">
          <div class="kpi-label"><span class="zone-dot z1"></span>Priority 1 · East</div>
          <div class="kpi-value" id="kpiZone1Count">—</div>
          <div class="kpi-meta" id="kpiZone1Meta">Whitefield, Bellandur, ORR</div>
        </button>
        <button class="kpi-card zone-2" type="button" data-zone="Priority 2: Central Bangalore" id="kpiZone2">
          <div class="kpi-label"><span class="zone-dot z2"></span>Priority 2 · Central</div>
          <div class="kpi-value" id="kpiZone2Count">—</div>
          <div class="kpi-meta" id="kpiZone2Meta">CBD, Vasanth Nagar, Malleshwaram</div>
        </button>
        <button class="kpi-card zone-3" type="button" data-zone="Priority 3: Rest of Bangalore" id="kpiZone3">
          <div class="kpi-label"><span class="zone-dot z3"></span>Priority 3 · Rest</div>
          <div class="kpi-value" id="kpiZone3Count">—</div>
          <div class="kpi-meta" id="kpiZone3Meta">Indiranagar, Koramangala, JP Nagar</div>
        </button>
      </section>

      <!-- Filter & Search Toolbar -->
      <section class="filter-toolbar" aria-label="Filter events">
        <div class="filter-row-top">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="searchInput" type="search" placeholder="Search events, artists, venues, localities…" autocomplete="off" />
          </div>
          <div class="select-group">
            <select id="timeframeSelect" aria-label="Filter by timeframe">
              <option value="all">All Dates</option>
              <option value="weekend">This Weekend</option>
              <option value="next7">Next 7 Days</option>
              <option value="next14">Next 14 Days</option>
              <option value="thisMonth">This Month</option>
              <option value="nextMonth">Next Month</option>
            </select>
            <select id="subgenreSelect" aria-label="Filter by sub-genre">
              <option value="all">All Genres</option>
            </select>
            <select id="localitySelect" aria-label="Filter by locality">
              <option value="all">All Localities</option>
            </select>
            <select id="sortSelect" aria-label="Sort events">
              <option value="dateAsc">Sort: Date (Soonest)</option>
              <option value="zoneAsc">Sort: Priority Zone</option>
              <option value="nameAsc">Sort: Name (A–Z)</option>
            </select>
          </div>
        </div>

        <div class="filter-row-bottom">
          <div class="pill-group" id="categoryPills" role="group" aria-label="Category filter">
            <button class="filter-pill active" type="button" data-category="all">All Categories</button>
            <button class="filter-pill" type="button" data-category="Music">Live Music &amp; Concerts</button>
            <button class="filter-pill" type="button" data-category="Plays">Plays &amp; Theatre</button>
            <button class="filter-pill" type="button" data-category="Sports">Sports &amp; Tournaments</button>
            <button id="newOnlyBtn" class="filter-pill new-pill" type="button" aria-pressed="false" title="Show only events added in the last 24 hours">
              <span class="new-dot"></span>
              <span>Added &lt;24h</span>
              <span id="newCountBadge" class="pill-count">0</span>
            </button>
          </div>
          <div class="results-meta">
            <span id="resultsCountText">Loading events…</span>
            <button id="resetFiltersBtn" class="btn-link hidden" type="button">Reset filters</button>
          </div>
        </div>
      </section>

      <!-- Events Display Container -->
      <section id="eventsContainer" class="events-container" aria-live="polite"></section>
    </main>

    <footer class="site-footer">
      <p>Live-synced directly from the <a href="https://docs.google.com/spreadsheets/d/1bD7iUv2YTf8aKaoOxntbqucqKP9RN7t825NWB8aTc0Q/edit?gid=0#gid=0" target="_blank" rel="noopener noreferrer">Bangalore Events Google Sheet</a>. Updates appear automatically on refresh.</p>
    </footer>
  </div>

  <!-- Event Detail Modal -->
  <div id="eventModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <button id="modalCloseBtn" class="modal-close" type="button" aria-label="Close modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
